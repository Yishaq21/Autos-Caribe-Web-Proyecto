<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body class="bg-light">
<header th:replace="~{general/fragmentos :: header}"></header>

<main class="container py-5">
    <div class="text-center mb-4">
        <h1 class="display-5 fw-bold">Catálogo de vehículos</h1>
        <p class="text-muted">Busca el vehículo que mejor se adapte a tus necesidades.</p>
    </div>

    <div class="card shadow-sm p-3 mb-4">
        <h2 class="h5 mb-3">Filtros del catálogo</h2>

        <div class="row g-3">
            <div class="col-lg-4">
                <form th:action="@{/catalogo/buscar}" method="get">
                    <label class="form-label" for="marca">Buscar por marca</label>
                    <input id="marca" class="form-control mb-2" type="text"
                           name="marca" th:value="${marca}" list="listaMarcas"
                           placeholder="Ej. Toyota">
                    <datalist id="listaMarcas">
                        <option th:each="m : ${marcas}" th:value="${m.marca}"></option>
                    </datalist>
                    <button class="btn btn-primary w-100" type="submit">
                        <i class="fa-solid fa-magnifying-glass"></i> Buscar marca
                    </button>
                </form>
            </div>

            <div class="col-lg-4">
                <form th:action="@{/catalogo/categoria}" method="get">
                    <label class="form-label" for="categoria">Filtrar por categoría</label>
                    <select id="categoria" class="form-select mb-2" name="categoria">
                        <option value="" th:selected="${categoria == null or categoria.isEmpty()}">Todas las categorías</option>
                        <option th:each="c : ${categorias}" th:value="${c.categoria}"
                                th:text="${c.categoria}"
                                th:selected="${categoria != null and categoria.equalsIgnoreCase(c.categoria)}"></option>
                    </select>
                    <button class="btn btn-primary w-100" type="submit">
                        <i class="fa-solid fa-filter"></i> Filtrar categoría
                    </button>
                </form>
            </div>

            <div class="col-lg-4">
                <form th:action="@{/catalogo/precio}" method="get">
                    <label class="form-label">Filtrar por precio</label>
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <input class="form-control" type="number" step="0.01"
                                   min="0" name="precioMinimo"
                                   th:value="${precioMinimo}"
                                   placeholder="Mínimo" required>
                        </div>
                        <div class="col-6">
                            <input class="form-control" type="number" step="0.01"
                                   min="0" name="precioMaximo"
                                   th:value="${precioMaximo}"
                                   placeholder="Máximo" required>
                        </div>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">
                        <i class="fa-solid fa-coins"></i> Filtrar precio
                    </button>
                </form>
            </div>
        </div>

        <div class="mt-3 text-center">
            <a class="btn btn-outline-secondary" th:href="@{/catalogo}">
                Mostrar todos los vehículos
            </a>
        </div>
    </div>

    <div class="alert alert-info" th:if="${vehiculos == null or vehiculos.empty}">
        No se encontraron vehículos con esos filtros.
    </div>

    <div class="row g-4" th:if="${vehiculos != null and !vehiculos.empty}">
        <div class="col-sm-6 col-lg-4" th:each="v : ${vehiculos}">
            <article class="card h-100 shadow-sm border-0">
                <img th:if="${v.rutaImagen != null and !v.rutaImagen.isBlank()}"
                     th:src="${v.rutaImagen}" class="card-img-top" style="height:220px;object-fit:cover" alt="Vehículo">
                <div th:unless="${v.rutaImagen != null and !v.rutaImagen.isBlank()}"
                     class="bg-secondary-subtle d-flex justify-content-center align-items-center" style="height:220px">
                    <i class="fa-solid fa-car-side fa-5x text-secondary"></i>
                </div>
                <div class="card-body d-flex flex-column">
                    <span class="badge text-bg-dark align-self-start mb-2" th:text="${v.categoria ?: 'Sin categoría'}"></span>
                    <h2 class="h4" th:text="${v.marca + ' ' + v.modelo}">Marca Modelo</h2>
                    <p class="text-muted mb-2">Año: <span th:text="${v.año ?: 'No indicado'}"></span></p>
                    <p class="fs-4 fw-bold text-primary mt-auto" th:text="${v.precio != null ? '₡' + #numbers.formatDecimal(v.precio, 0, 'COMMA', 2, 'POINT') : 'Consultar precio'}"></p>
                    <a class="btn btn-outline-primary w-100" th:href="@{/catalogo/detalle/{id}(id=${v.idVehiculo})}">Ver detalles</a>
                </div>
            </article>
        </div>
    </div>
</main>

<section th:replace="~{general/fragmentos :: mostrarToast}"></section>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
