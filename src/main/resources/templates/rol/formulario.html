<<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Formulario de Rol - Autos Caribe</title>
        <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="container mt-4">
            <h2 th:text="${rolForm.idRol == null} ? 'Nuevo Rol' : 'Editar Rol'"></h2>

            <form th:action="@{/admin/roles/guardar}" th:object="${rolForm}" method="post" class="bg-white p-4 rounded shadow-sm">
                <input type="hidden" th:field="*{idRol}">

                <div class="mb-3">
                    <label class="form-label">Nombre del Rol</label>
                    <input type="text" class="form-control" th:field="*{rol}" placeholder="Ej: ADMINISTRADOR" required>
                    <span class="text-danger" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></span>
                </div>

                <button type="submit" class="btn btn-dark">Guardar</button>
                <a th:href="@{/admin/roles}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </body>
</html>
