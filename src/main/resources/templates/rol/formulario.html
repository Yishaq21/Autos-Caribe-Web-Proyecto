<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body class="bg-light">

    <!-- Inyectamos el menú de navegación -->
    <header th:replace="~{general/fragmentos :: header}"></header>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white text-center">
                        <!-- Título dinámico: Nuevo o Editar -->
                        <h4>
                            <i class="fa-solid fa-id-badge"></i> 
                            <span th:text="${rolForm.idRol == null} ? #{rol.nuevo} : #{rol.editar}"></span>
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <form th:action="@{/rol/guardar}" th:object="${rolForm}" method="post" class="was-validated">
                            <input type="hidden" th:field="*{idRol}">
                            
                            <!-- Token de seguridad CSRF -->
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="mb-3">
                                <label class="form-label" th:text="#{rol.nombre}"></label>
                                <input type="text" class="form-control" th:field="*{rol}" th:placeholder="#{rol.placeholder}" required="true">
                                <span class="text-danger" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></span>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-dark" th:text="#{accion.guardar}"></button>
                                <a th:href="@{/rol/listado}" class="btn btn-secondary" th:text="#{accion.cancelar}"></a>
                            </div>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Inyectamos el footer -->
    <footer th:replace="~{general/fragmentos :: footer}"></footer>

</body>
</html>
