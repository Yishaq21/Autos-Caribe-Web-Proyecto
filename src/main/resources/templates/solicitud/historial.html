<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-1"><i class="fa-solid fa-clock-rotate-left"></i> Historial de solicitudes</h2>
            <p class="text-muted mb-0">Consulte las solicitudes de información que ha enviado.</p>
        </div>
        <a th:href="@{/solicitud/listado}" class="btn btn-primary">Nueva solicitud</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive" th:if="${solicitudes != null and !solicitudes.empty}">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Vehículo</th>
                        <th>Vendedor</th>
                        <th>Mensaje</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${solicitudes}">
                        <td th:text="${s.idSolicitud}"></td>
                        <td th:text="${s.vehiculo.marca + ' ' + s.vehiculo.modelo}"></td>
                        <td th:text="${s.vendedor.nombre + ' ' + s.vendedor.apellidos}"></td>
                        <td th:text="${s.mensaje}"></td>
                        <td>
                            <span class="badge bg-warning text-dark" th:if="${s.estado == 'PENDIENTE'}">PENDIENTE</span>
                            <span class="badge bg-success" th:if="${s.estado == 'ACEPTADA'}">ACEPTADA</span>
                            <span class="badge bg-danger" th:if="${s.estado == 'RECHAZADA'}">RECHAZADA</span>
                        </td>
                        <td th:text="${#temporals.format(s.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${solicitudes == null or solicitudes.empty}" class="text-center py-5">
                <i class="fa-regular fa-folder-open fa-3x mb-3"></i>
                <h5>Aún no tiene solicitudes</h5>
                <a th:href="@{/catalogo}" class="btn btn-outline-primary mt-2">Ir al catálogo</a>
            </div>
        </div>
    </div>
</main>

<section th:replace="~{general/fragmentos :: mostrarToast}"></section>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
