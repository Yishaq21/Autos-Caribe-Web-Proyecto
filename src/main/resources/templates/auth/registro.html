<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body class="bg-light">

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4><i class="fa-solid fa-user-plus"></i> [[#{registro.titulo}]]</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/registro/guardar}" th:object="${usuario}" method="post" class="was-validated">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="mb-3">
                                <label for="username" class="form-label" th:text="#{usuario.username}"></label>
                                <input type="text" class="form-control" th:field="*{username}" required="true" maxlength="30">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label" th:text="#{usuario.password}"></label>
                                <input type="password" class="form-control" th:field="*{password}" required="true" maxlength="512">
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nombre" class="form-label" th:text="#{usuario.nombre}"></label>
                                    <input type="text" class="form-control" th:field="*{nombre}" required="true" maxlength="20">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="apellidos" class="form-label" th:text="#{usuario.apellidos}"></label>
                                    <input type="text" class="form-control" th:field="*{apellidos}" required="true" maxlength="30">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label" th:text="#{usuario.correo}"></label>
                                <input type="email" class="form-control" th:field="*{correo}" required="true" maxlength="75">
                            </div>
                            <div class="mb-3">
                                <label for="telefono" class="form-label" th:text="#{usuario.telefono}"></label>
                                <input type="tel" class="form-control" th:field="*{telefono}" maxlength="25">
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-success" th:text="#{registro.boton.completar}"></button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <span th:text="#{registro.ya_cuenta}"></span> 
                        <a th:href="@{/login}" th:text="#{login.boton.ingresar}"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
